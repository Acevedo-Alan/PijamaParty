# Test-only overrides of src/main/resources/application.yml (classpath:/config/ takes precedence over it).
store:
  admin:
    # T-E1-16: a fixed test key for the authenticator secrets
    second-factor-key: nrmfHm2pxZS9/+IgFjDVBvXDS29OvDAUhjc65qBenAk= # gitleaks:allow
  cart:
    cleanup:
      # T-E2-04: tests run the cleanup themselves, never on a schedule ("-" disables the cron)
      cron: "-"
  activity:
    retention:
      # T-E8-01: tests run the retention job themselves, never on a schedule
      cron: "-"
  platform:
    idempotency-purge:
      # T-E3-14: tests run the purge themselves, never on a schedule
      cron: "-"
  ordering:
    reservation-expiry:
      # T-E3-04: tests run the expiry themselves, never on a schedule
      cron: "-"
  payments:
    reconciliation:
      # T-E3b-03: tests run the reconciliation themselves, never on a schedule
      cron: "-"
  notifications:
    # T-E3-09: tests send the outbox themselves, never on a schedule; Resend is a local stub (ResendStub)
    from: "Pijama Party <pedidos@pijamaparty.test>"
    reply-to: hola@pijamaparty.test
    admin-recipient: admin@pijamaparty.test
    outbox:
      cron: "-"
  rate-limit:
    # Every test calls from 127.0.0.1 and Spring reuses the context across test classes, so the real RNF-22 policies
    # would turn unrelated tests into 429s. The rate-limit tests turn it back on with store.rate-limit.enabled=true.
    enabled: false
