# Local PostgreSQL for development (T-E0-03). From the repository root:
#   docker compose -f deploy/docker-compose.dev.yml --env-file .env up -d
# Production (api, db, caddy) lives in deploy/docker-compose.yml.
name: pijamaparty-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pijamaparty}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
      TZ: America/Argentina/Buenos_Aires
    # RNF-21 server settings, the same as in production and in the Testcontainers tests
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - statement_timeout=10s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - shared_buffers=512MB
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-pijamaparty}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
