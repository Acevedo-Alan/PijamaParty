# Continuous integration (T-E0-05): build and test backend and frontend on every push and pull request.
# Actions are pinned to full commit SHAs (supply chain, RNF-29.11); the comment shows the release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main gets a complete run; only superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-javascript:
    name: TypeScript only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CLAUDE.md: no .js/.jsx/.mjs/.cjs files anywhere, configs and scripts included.
      - name: Fail on tracked JavaScript files
        run: |
          files=$(git ls-files -- '*.js' '*.jsx' '*.mjs' '*.cjs' ':(exclude,glob)**/node_modules/**' ':(exclude,glob)**/dist/**')
          if [ -n "$files" ]; then
            echo "::error::JavaScript files are not allowed (TypeScript only):"
            echo "$files"
            exit 1
          fi

  backend:
    name: Backend (./mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit, architecture (ArchUnit, Spring Modulith) and Testcontainers tests. SpotBugs/find-sec-bugs runs too but only
      # reports until T-E0-15 makes SQL-injection findings fail the build.
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Keep the OpenAPI contract for the client check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-contract
          path: backend/target/openapi/openapi.json
          if-no-files-found: error

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-contract:
    name: Generated API client matches the backend
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-contract
          path: backend/target/openapi
      - run: npm ci
      # CLAUDE.md: API changes update OpenAPI; the typed client must be regenerated in the same change.
      - name: Regenerate the client and fail if it changed
        run: |
          npm run api:generate
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date: run the backend tests, then npm run api:generate"
            exit 1
          }
