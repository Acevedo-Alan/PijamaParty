# Customer-facing texts of the backend, in Spanish (Argentina). Read through Spring's MessageSource (UTF-8).
# Arguments are passed already formatted, so MessageFormat never groups digits (1001, not 1.001).

# UC-14 (T-E3-06): the single line of the order's payment at the provider ({0}: the order number)
payments.checkout.title=Pedido #{0} - Pijama Party

# UC-17 (T-E3-09): the payment-confirmed email to the buyer ({0}: the order number, {1}: the buyer's first name)
notifications.order-paid.customer.subject=Recibimos tu pago - Pedido #{0}
notifications.order-paid.customer.greeting=¡Hola, {1}!
notifications.order-paid.customer.intro=Recibimos el pago de tu pedido #{0}. ¡Gracias por comprar en Pijama Party!
notifications.order-paid.customer.address=Lo enviamos a:
notifications.order-paid.customer.tracking=Podés seguir tu pedido en este enlace. Cuando lo despachemos, ahí vas a ver el número de seguimiento del envío.
notifications.order-paid.customer.tracking-button=Ver mi pedido
notifications.order-paid.customer.reply=Si tenés alguna consulta, respondé este correo y te contestamos.

# UC-17 (T-E3-09): the notice to the administrator ({0}: the order number)
notifications.order-paid.admin.subject=Nuevo pedido pagado #{0}
notifications.order-paid.admin.intro=Se pagó el pedido #{0}.
notifications.order-paid.admin.buyer=Cliente:
notifications.order-paid.admin.destination=Envío a:
notifications.order-paid.admin.back-office=El pedido ya está en el backoffice.

# UC-17: the order summary of both emails ({0}: product, {1}: size, {2}: color, {3}: quantity; {0} of the discount:
# the coupon code)
notifications.order.line={0} - Talle {1} - {2} x {3}
notifications.order.subtotal=Subtotal
notifications.order.discount=Descuento ({0})
notifications.order.shipping=Envío
