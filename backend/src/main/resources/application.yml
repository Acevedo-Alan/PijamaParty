# Shared configuration for every profile. No secrets here: credentials come from environment variables (.env.example).
# No default profile: without SPRING_PROFILES_ACTIVE nothing dev-only (Swagger, local defaults) is enabled.
spring:
  application:
    name: store
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # UC-06: photos up to 10 MB (a larger one gets 413); the rest of the request is the color field
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?logServerErrorDetail=false
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    # RNF-21: bounded pool; when it is exhausted for 3 s the request fails fast (503 in T-E0-11)
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000      # ms (Hikari takes plain milliseconds)
      max-lifetime: 1500000         # 25 min
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes only through Flyway; Hibernate only checks that the mappings match it
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # RNF-27: migrations run as the table owner; the application connects as tienda_app (T-E0-13)
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  modulith:
    events:
      # Completed event publications are deleted, so serialized events do not pile up in the database
      completion-mode: delete
  task:
    scheduling:
      # RNF-21: one thread per scheduled job (4 today), so a slow email provider never delays the reservation expiry
      pool:
        size: 4

server:
  # RNF-22: the real client IP comes from X-Forwarded-For only when the connection comes from a trusted proxy
  # (Tomcat RemoteIpValve, private network addresses by default); Caddy overwrites that header (T-E0-06).
  forward-headers-strategy: native
  # RNF-21: bounded classic thread pool. At most 40 requests run and 100 more wait inside Tomcat
  # (max-connections = threads + queue); beyond that the OS backlog (accept-count) fills and new connections are
  # refused or dropped, which Caddy answers with 503 + Retry-After (T-E0-06).
  tomcat:
    threads:
      max: 40
      min-spare: 5
    max-connections: 140
    accept-count: 100
    connection-timeout: 10s
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # UC-04, RNF-24: the back office session expires after 60 minutes of inactivity (Spring Session JDBC)
      timeout: 60m
      cookie:
        # RNF-29.1; the session id changes on login (Spring Security session fixation protection)
        http-only: true
        secure: true
        same-site: lax

store:
  # T-E3-06: the storefront's origin (scheme and host, no path), where MercadoPago sends the buyer back and notifies
  # the payments. Production sets https://${DOMAIN} (deploy/docker-compose.yml).
  public-url: ${PUBLIC_URL:http://localhost:5173}
  # UC-04: the first administrator, created at startup only when none exists (ADMIN_INITIAL_PASSWORD is a Docker
  # secret in production, read through the configtree import). Ignored once an administrator exists.
  admin:
    email: ${ADMIN_EMAIL:}
    name: ${ADMIN_NAME:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    # T-E1-16: AES-256 key (base64 of 32 bytes) that encrypts the authenticator secret; a Docker secret in production.
    # Without a valid key the API does not start.
    second-factor-key: ${SECOND_FACTOR_KEY:}
    # T-E1-16: true for one start after losing the phone and the recovery codes: deletes the second factor.
    reset-second-factor: ${ADMIN_RESET_SECOND_FACTOR:false}
  images:
    # UC-06: the uploads volume, which Caddy serves under /uploads (deploy/docker-compose.yml)
    uploads-dir: ${UPLOADS_DIR:/srv/uploads}
    vips:
      # Where vips and vipsheader are (libvips command line); empty: on the PATH, as in the API image
      bin-dir: ${VIPS_BIN_DIR:}
      # Each libvips step of a conversion; a photo the device already shrank takes well under a second
      timeout: 30s
    # RNF-21 (T-E1-14): conversions running at a time; another upload waits this long for one to end, then gets 503
    conversions:
      max-concurrent: 2
      queue-timeout: 10s
  cart:
    cleanup:
      # T-E2-04: every day at 04:00 store time (America/Argentina/Buenos_Aires), the quietest hour, the carts idle
      # for more than 30 days are deleted
      cron: "0 0 4 * * *"
  platform:
    idempotency-purge:
      # T-E3-14 (RNF-20.2): every day at 04:30 store time, after the cart cleanup, the Idempotency-Keys past their 24
      # hours are deleted
      cron: "0 30 4 * * *"
  ordering:
    # T-E3-05, RNF-30.6: the version of the terms and the exchange and returns policy linked in the checkout. Every
    # order keeps the one in force when it was placed; change it whenever the legal texts change.
    terms-version: "2026-10"
    reservation-expiry:
      # T-E3-04, UC-16: every minute, at second 0, the orders awaiting payment whose 30-minute reservation is over
      # become EXPIRED and release their stock
      cron: "0 * * * * *"
  payments:
    mercadopago:
      # T-E3-06: Checkout Pro. The access token is the Docker secret MERCADOPAGO_ACCESS_TOKEN in production (test
      # credentials give the sandbox); empty, every checkout is unavailable and the buyer retries from the tracking
      # page. RNF-21: 3 s to connect, 10 s to read, no retries.
      base-url: https://api.mercadopago.com
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      connect-timeout: 3s
      read-timeout: 10s
      # T-E3-07, RNF-29.3: the secret key that signs the Webhooks notifications (the Docker secret
      # MERCADOPAGO_WEBHOOK_SECRET in production); empty, every notification is refused with 401. A signed
      # notification older than webhook-max-age is refused too: MercadoPago retries for hours.
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
      webhook-max-age: 24h
    modo:
      # T-E3b-02: MODO's payment button, switched off by default (MODO_ENABLED), so the store can go live with
      # MercadoPago alone; off, the checkout refuses MODO. The credentials are the Docker secrets MODO_USERNAME and
      # MODO_PASSWORD in production; MODO's generic preproduction credentials serve for development, with the
      # preproduction URLs (https://merchants.preprod.playdigital.com.ar and https://site.preprod.modo.com.ar).
      # Without credentials or processor code every MODO checkout is unavailable. RNF-21: 3 s to connect, 10 s to
      # read, no retries.
      enabled: ${MODO_ENABLED:false}
      base-url: ${MODO_BASE_URL:https://merchants.playdigital.com.ar}
      checkout-url: ${MODO_CHECKOUT_URL:https://site.modo.com.ar}
      username: ${MODO_USERNAME:}
      password: ${MODO_PASSWORD:}
      # The card gateway's code (Payway, Fiserv, Getnet or Line) that MODO sends with the credentials
      processor-code: ${MODO_PROCESSOR_CODE:}
      # One payment, no installments: MODO reports the amount with the installments' interest
      cc-code: 1CSI
      merchant-name: PijamaParty
      connect-timeout: 3s
      read-timeout: 10s
    reconciliation:
      # T-E3b-03, UC-15: every minute, at second 15, the MODO payment requests created more than a minute ago and
      # expired less than 15 minutes ago, of a payment still pending or rejected, are asked to MODO, since MODO
      # retries a notification for only 14 seconds. MODO's webhook verifies its signature with the JWK set of
      # base-url.
      cron: "15 * * * * *"
  notifications:
    # T-E3-09 (UC-17, RNF-23): the sender (e.g. Pijama Party <pedidos@notificaciones.DOMAIN>, a domain verified at
    # Resend, T-E3-18), where the buyer's answers go (the business's email; optional) and the administrator told of
    # every paid order. Production requires MAIL_FROM and NOTIFICATIONS_ADMIN_EMAIL.
    from: ${MAIL_FROM:}
    reply-to: ${MAIL_REPLY_TO:}
    admin-recipient: ${NOTIFICATIONS_ADMIN_EMAIL:}
    outbox:
      # T-E3-09: every minute, at second 30 (the reservation expiry runs at second 0), the emails due are sent;
      # retried at 1, 5, 15 and 60 minutes, at most 5 attempts
      cron: "30 * * * * *"
    resend:
      # T-E3-09: the API key is the Docker secret RESEND_API_KEY in production; empty, every email waits in the
      # outbox. RNF-21: 3 s to connect, 10 s to read, no retries (the outbox retries).
      base-url: https://api.resend.com
      api-key: ${RESEND_API_KEY:}
      # T-E3-22, RNF-29.3: the webhook's "Signing secret" in Resend's dashboard (whsec_...; the Docker secret
      # RESEND_WEBHOOK_SECRET in production); empty, every bounce or complaint notification is refused with 401.
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
      connect-timeout: 3s
      read-timeout: 10s
  saturation:
    # RNF-21: Retry-After of the 503 sent when a pool is exhausted
    retry-after: 5s
  # RNF-22: policies are added by the stage that creates each endpoint (see RateLimitProperties)
  rate-limit:
    idle-expiry: 1h
    max-buckets: 100000
    # Webhooks are protected by the provider signature; health is polled by monitoring
    excluded-paths:
      - /api/health
      - /api/payments/*/webhook
      - /api/mail/webhook
    policies:
      # UC-04 and UC-19 (T-E4-10): sign-in attempts per IP and, separately, per account (normalized email,
      # RNF-29.5). The administrator's and the customers' sign-ins share both buckets: one IP gets 5 attempts a minute
      # in all, and an email 5 whichever sign-in it goes through.
      # T-E1-16: the second-factor steps count for the same per-IP limit as the password
      - name: login-ip
        paths: [/api/admin/auth/login, /api/admin/auth/second-factor, /api/admin/auth/enrollment, /api/account/login]
        methods: [POST]
        keys: [ip]
        capacity: 5
        period: 1m
      - name: login-account
        paths: [/api/admin/auth/login, /api/account/login]
        methods: [POST]
        keys: [sign-in-email]
        capacity: 5
        period: 1m
      # UC-19 (T-E4-10): registrations and password recoveries per IP, in one bucket; each one may send an email
      - name: account-email
        paths: [/api/account/register, /api/account/password-recovery]
        methods: [POST]
        keys: [ip]
        capacity: 3
        period: 1h
      # UC-01 to UC-03 and UC-26: generous, many shoppers share a mobile-data IP
      - name: catalog
        paths: [/api/catalog/**]
        methods: [GET]
        keys: [ip]
        capacity: 120
        period: 1m
      # UC-08, UC-09, UC-10: cart changes per IP. Brought forward from T-E2-11 by T-E2-04: a client without a cookie
      # gets a new cart with each add, so this also bounds how many carts one IP can create. Applying and removing a
      # coupon are cart changes too, and this is the baseline of a coupon request without a cart cookie.
      - name: cart
        paths: [/api/cart/items, /api/cart/items/*, /api/cart/acknowledge-prices, /api/cart/coupon]
        methods: [POST, PATCH, DELETE]
        keys: [ip]
        capacity: 60
        period: 1m
      # UC-10 (T-E2-11): coupon attempts per cart and IP together; each one also counts for cart
      - name: coupon
        paths: [/api/cart/coupon]
        methods: [POST]
        keys: [cart, ip]
        capacity: 10
        period: 1m
      # UC-26: a catalog request with the text parameter q (search or suggestions); it also counts for catalog
      - name: search
        paths: [/api/catalog/products, /api/catalog/suggestions]
        methods: [GET]
        keys: [search, ip]
        capacity: 60
        period: 1m
      # UC-13 (T-E3-19): checkout confirmations per cart and IP together. Without a cart cookie the policy does not
      # apply: there is no cart to buy, and the checkout answers 409 EMPTY_CART.
      - name: checkout
        paths: [/api/checkout]
        methods: [POST]
        keys: [cart, ip]
        capacity: 5
        period: 1m
      # UC-14 (T-E3-08): the tracking link per IP, reading the order and retrying its payment. 128 random bits make
      # guessing a token hopeless anyway; this bounds the scraping of known ones.
      - name: order-tracking
        paths: [/api/orders/*, /api/orders/*/retry-payment, /api/orders/*/email]
        keys: [ip]
        capacity: 30
        period: 1m
      # T-E3-08: each retry may call the payment provider, so per order (its tracking token) and IP together
      - name: payment-retry
        paths: [/api/orders/*/retry-payment]
        methods: [POST]
        keys: [tracking, ip]
        capacity: 5
        period: 1m
      # UC-17 (T-E3-23): email corrections per order (its tracking token) and IP together; each may send the
      # confirmation again
      - name: email-correction
        paths: [/api/orders/*/email]
        methods: [PATCH]
        keys: [tracking, ip]
        capacity: 3
        period: 1h
      # UC-29 (T-E3-25): withdrawal requests per order number (from the body) and IP together; each new one sends
      # two emails
      - name: withdrawal
        paths: [/api/withdrawals]
        methods: [POST]
        keys: [order-number, ip]
        capacity: 3
        period: 1h
      # T-E3-28: the authenticated back office per user (from the session). Without a signed-in session the policy
      # does not apply: the route answers 401, and the sign-in has its own policies above.
      - name: back-office
        paths: [/api/admin/**]
        keys: [user]
        capacity: 300
        period: 1m

# OpenAPI and Swagger UI only in dev (the contract is not published in prod)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pijamaparty}?logServerErrorDetail=false
    username: ${DB_APP_USER:tienda_app}
    hikari:
      # RNF-21: leak detection only in dev
      leak-detection-threshold: 10000  # ms

  flyway:
    user: ${DB_OWNER_USER:tienda_owner}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

store:
  admin:
    # Local development only; production has no default and reads the Docker secret SECOND_FACTOR_KEY
    second-factor-key: ${SECOND_FACTOR_KEY:nrwogtH9OX5wrWlHAXKmmbtPbRf5i2Ybs92t/7nSY3E=} # gitleaks:allow

---
spring:
  config:
    activate:
      on-profile: prod
  # Migrations run in the one-shot migrate container as tienda_owner (deploy/docker-compose.yml): the application
  # never holds the owner credentials (RNF-27).
  flyway:
    enabled: false

server:
  tomcat:
    remoteip:
      # RNF-22: only Caddy may set X-Forwarded-For (a regex of its fixed address in the compose network, T-E0-06);
      # the default trusts every private network.
      internal-proxies: ${TRUSTED_PROXY_REGEX}

store:
  # T-E3-06, T-E3-07: the API does not start without them in production
  public-url: ${PUBLIC_URL}
  payments:
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET}
    modo:
      # T-E3b-02: nor with MODO enabled without its credentials and processor code
      require-credentials: true
  # T-E3-09: nor without these
  notifications:
    from: ${MAIL_FROM}
    admin-recipient: ${NOTIFICATIONS_ADMIN_EMAIL}
    resend:
      api-key: ${RESEND_API_KEY}
      webhook-secret: ${RESEND_WEBHOOK_SECRET}
