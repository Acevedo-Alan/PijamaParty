# Shared configuration for every profile. No secrets here: credentials come from environment variables (.env.example).
spring:
  application:
    name: store
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes only through Flyway
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pijamaparty}

---
spring:
  config:
    activate:
      on-profile: prod
