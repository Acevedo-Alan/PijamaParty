# Production (T-E0-06): caddy, api, db and a one-shot migrate step, on the single 4 GB server. From the repository
# root, with deploy/secrets/ filled (see deploy/secrets/README.md) and DOMAIN in .env:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --wait
name: pijamaparty

x-db-connection: &db-connection
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-pijamaparty}

# Bounded json-file logs (the single server must not fill its disk) and no privilege gain through setuid binaries.
x-hardening: &hardening
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
      args:
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-}
        VITE_META_PIXEL_ID: ${VITE_META_PIXEL_ID:-}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - uploads:/srv/uploads:ro
    networks:
      edge:
        # Fixed address: the only proxy the API trusts for X-Forwarded-For (TRUSTED_PROXY_REGEX, RNF-22).
        ipv4_address: 172.30.0.10
    depends_on:
      - api

  api:
    <<: *hardening
    build:
      context: ../backend
    restart: unless-stopped
    cap_drop: [ALL]
    # No ports: only Caddy reaches the API (RNF-22).
    environment:
      <<: *db-connection
      SPRING_PROFILES_ACTIVE: prod
      DB_APP_USER: tienda_app
      TRUSTED_PROXY_REGEX: 172\.30\.0\.10
      # UC-04: the first administrator, created at startup only when none exists (password: Docker secret below)
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_NAME: ${ADMIN_NAME:?set ADMIN_NAME in .env}
      # T-E1-16: true for one start only, after losing the phone and the recovery codes (runbook)
      ADMIN_RESET_SECOND_FACTOR: ${ADMIN_RESET_SECOND_FACTOR:-false}
      # T-E3-06: where MercadoPago sends the buyer back and notifies the payments
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      # T-E3-09: the payment-confirmed emails (Resend's API key: Docker secret below)
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      NOTIFICATIONS_ADMIN_EMAIL: ${NOTIFICATIONS_ADMIN_EMAIL:?set NOTIFICATIONS_ADMIN_EMAIL in .env}
      # T-E3b-02: MODO, off unless MODO_ENABLED=true; then MODO_PROCESSOR_CODE and the two MODO secrets are required
      MODO_ENABLED: ${MODO_ENABLED:-false}
      MODO_PROCESSOR_CODE: ${MODO_PROCESSOR_CODE:-}
      # T-E4-14: sign-in with Google and Facebook (UC-27), each one off without its client id; the client secrets are
      # Docker secrets below
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      # Docker secrets, mounted as files, become properties (e.g. ${DB_APP_PASSWORD}).
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - DB_APP_PASSWORD
      - ADMIN_INITIAL_PASSWORD
      - SECOND_FACTOR_KEY
      - MERCADOPAGO_ACCESS_TOKEN
      - MERCADOPAGO_WEBHOOK_SECRET
      - MODO_USERNAME
      - MODO_PASSWORD
      - RESEND_API_KEY
      - RESEND_WEBHOOK_SECRET
      - GOOGLE_CLIENT_SECRET
      - FACEBOOK_CLIENT_SECRET
    volumes:
      - uploads:/srv/uploads
    networks: [edge, data]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Migrations as tienda_owner; the API never holds the owner credentials (RNF-27, RNF-29.10).
  migrate:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    restart: "no"
    cap_drop: [ALL]
    environment:
      <<: *db-connection
      DB_OWNER_USER: tienda_owner
    secrets:
      - DB_OWNER_PASSWORD
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pijamaparty}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_ADMIN_PASSWORD
      DB_OWNER_PASSWORD_FILE: /run/secrets/DB_OWNER_PASSWORD
      DB_APP_PASSWORD_FILE: /run/secrets/DB_APP_PASSWORD
      DB_BACKUP_PASSWORD_FILE: /run/secrets/DB_BACKUP_PASSWORD
      TZ: America/Argentina/Buenos_Aires
    # RNF-21 server settings (the application role also has them per role, see deploy/db/init/01-roles.sh)
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - statement_timeout=10s
      - -c
      - idle_in_transaction_session_timeout=30s
      - -c
      - shared_buffers=512MB
      # R-05: a failing statement logs no DETAIL ("Key (email)=...", "Failing row contains ..."): no personal data
      # in the server log. Clients still get the full error.
      - -c
      - log_error_verbosity=terse
    secrets:
      - DB_ADMIN_PASSWORD
      - DB_OWNER_PASSWORD
      - DB_APP_PASSWORD
      - DB_BACKUP_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-pijamaparty}"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Caddy and the API. Automatic addresses come from the upper half, so no container can take Caddy's fixed one.
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  # The database, reachable only by the API and the migrate step, never by Caddy, and with no outside access.
  data:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
  uploads:

# RNF-29.10: one file per secret, outside git (deploy/secrets/ is ignored).
secrets:
  DB_ADMIN_PASSWORD:
    file: ./secrets/DB_ADMIN_PASSWORD
  DB_OWNER_PASSWORD:
    file: ./secrets/DB_OWNER_PASSWORD
  DB_APP_PASSWORD:
    file: ./secrets/DB_APP_PASSWORD
  DB_BACKUP_PASSWORD:
    file: ./secrets/DB_BACKUP_PASSWORD
  ADMIN_INITIAL_PASSWORD:
    file: ./secrets/ADMIN_INITIAL_PASSWORD
  SECOND_FACTOR_KEY:
    file: ./secrets/SECOND_FACTOR_KEY
  MERCADOPAGO_ACCESS_TOKEN:
    file: ./secrets/MERCADOPAGO_ACCESS_TOKEN
  MERCADOPAGO_WEBHOOK_SECRET:
    file: ./secrets/MERCADOPAGO_WEBHOOK_SECRET
  MODO_USERNAME:
    file: ./secrets/MODO_USERNAME
  MODO_PASSWORD:
    file: ./secrets/MODO_PASSWORD
  RESEND_API_KEY:
    file: ./secrets/RESEND_API_KEY
  RESEND_WEBHOOK_SECRET:
    file: ./secrets/RESEND_WEBHOOK_SECRET
  GOOGLE_CLIENT_SECRET:
    file: ./secrets/GOOGLE_CLIENT_SECRET
  FACEBOOK_CLIENT_SECRET:
    file: ./secrets/FACEBOOK_CLIENT_SECRET
