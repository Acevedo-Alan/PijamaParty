<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Volvemos en unos minutos · Pijama Party</title>
  <style>
    :root {
      --bg: #fff7fa;
      --text: #3b2a33;
      --muted: #6b5560;
      --accent: #b3366b;
      --accent-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241a1f;
        --text: #f6e9ef;
        --muted: #cbb5c0;
        --accent: #e58ab0;
        --accent-text: #241a1f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; text-wrap: balance; }
    p { margin: 0 0 16px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    a.primary { background: var(--accent); color: var(--accent-text); }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Estamos haciendo mejoras en la tienda</h1>
    <p>Volvemos en unos minutos. Si ya pagaste un pedido, no se pierde: lo vas a ver apenas la tienda vuelva.</p>
    <p>Mientras tanto podés escribirnos.</p>
    <div class="actions">
      <a class="button primary" href="">Volver a intentar</a>
      <a class="button" href="https://wa.me/5493425304507">WhatsApp</a>
      <a class="button" href="https://www.instagram.com/pijamaparty.zzz/">Instagram</a>
    </div>
  </main>
</body>
</html>
